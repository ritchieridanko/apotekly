syntax = "proto3";

package product.v1;

import "google/protobuf/empty.proto";

option go_package = "github.com/ritchieridanko/apotekly/services/shared/contract/apis/v1;apis";

service ProductImageService {
  rpc UploadProductImages (UploadProductImagesRequest) returns (UploadProductImagesResponse);
  rpc GetAllProductImages (GetAllProductImagesRequest) returns (GetAllProductImagesResponse);
  rpc UpdateProductImage (UpdateProductImageRequest) returns (UpdateProductImageResponse);
  rpc DeleteProductImage (DeleteProductImageRequest) returns (google.protobuf.Empty);
  rpc ReorderProductImage (ReorderProductImageRequest) returns (ReorderProductImageResponse);
}

message ProductImage {
  string id = 1;
  string product_id = 2;
  string name = 3;
  string image = 4;
  optional string alt_text = 5;
  int32 sort_order = 6;
}

message UploadProductImageRequest {
  string name = 1;
  string url = 2;
  optional string alt_text = 3;
}

message UploadProductImagesRequest {
  // Params
	string product_id = 1;

  // Data
  repeated UploadProductImageRequest images = 2;
}

message UploadProductImagesResponse {
  repeated ProductImage product_images = 1;
}

message GetAllProductImagesRequest {
  string product_id = 1;
}

message GetAllProductImagesResponse {
  repeated ProductImage product_images = 1;
}

message UpdateProductImageRequest {
  // Params
  string product_image_id = 1;
  string product_id = 2;

  // Data
  optional string name = 3;
  optional string alt_text = 4;
}

message UpdateProductImageResponse {
  ProductImage product_image = 1;
}

message DeleteProductImageRequest {
  string product_image_id = 1;
  string product_id = 2;
}

message ReorderProductImageRequest {
  // Params
  string product_image_id = 1;
  string product_id = 2;

  // Data
  int32 new_sort_order = 3;
}

message ReorderProductImageResponse {
  ProductImage product_image = 1;
}
