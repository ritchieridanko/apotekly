      - DATABASE_USER=${PHARMACY_DATABASE_USER}
      - DATABASE_PASS=${PHARMACY_DATABASE_PASS}
      - DATABASE_NAME=${PHARMACY_DATABASE_NAME}
      - DATABASE_SSL_MODE=${PHARMACY_DATABASE_SSL_MODE}
    depends_on:
      pharmacy-database:
        condition: service_healthy
    entrypoint: ["./bin/migrator"]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "${PHARMACY_DATABASE_HOST}"]
      interval: 10s
      retries: 3

  # ---------- Product ----------
  product-database:
    image: postgres:16-alpine
    container_name: ${PRODUCT_DATABASE_HOST}
    networks:
      - apotekly-net
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${PRODUCT_DATABASE_USER}
      - POSTGRES_PASSWORD=${PRODUCT_DATABASE_PASS}
      - POSTGRES_DB=${PRODUCT_DATABASE_NAME}
    volumes:
      - product_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PRODUCT_DATABASE_USER} -d ${PRODUCT_DATABASE_NAME}"]
      interval: 2s
      timeout: 5s
      retries: 30
