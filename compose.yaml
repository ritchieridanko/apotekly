      - SERVER_HOST=${PHARMACY_SERVICE_HOST}
      - SERVER_PORT=${PHARMACY_SERVICE_PORT}
      - SERVER_TIMEOUT_SHUTDOWN=${PHARMACY_SERVICE_TIMEOUT_SHUTDOWN}
      - DATABASE_HOST=${PHARMACY_DATABASE_HOST}
      - DATABASE_PORT=${PHARMACY_DATABASE_PORT}
      - DATABASE_USER=${PHARMACY_DATABASE_USER}
      - DATABASE_PASS=${PHARMACY_DATABASE_PASS}
      - DATABASE_NAME=${PHARMACY_DATABASE_NAME}
      - DATABASE_SSL_MODE=${PHARMACY_DATABASE_SSL_MODE}
      - DATABASE_MAX_CONNS=${PHARMACY_DATABASE_MAX_CONNS}
      - DATABASE_MIN_CONNS=${PHARMACY_DATABASE_MIN_CONNS}
      - DATABASE_MAX_CONN_LIFETIME=${PHARMACY_DATABASE_MAX_CONN_LIFETIME}
