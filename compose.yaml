      - DATABASE_PORT=${PRODUCT_DATABASE_PORT}
      - DATABASE_USER=${PRODUCT_DATABASE_USER}
      - DATABASE_PASS=${PRODUCT_DATABASE_PASS}
      - DATABASE_NAME=${PRODUCT_DATABASE_NAME}
      - DATABASE_SSL_MODE=${PRODUCT_DATABASE_SSL_MODE}
    depends_on:
      product-database:
        condition: service_healthy
    entrypoint: ["./bin/migrator"]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "${PRODUCT_DATABASE_HOST}"]
      interval: 10s
      retries: 3

  # ---------- User ----------
  user-service:
