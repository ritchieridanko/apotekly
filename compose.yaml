      - POSTGRES_PASSWORD=${PHARMACY_DATABASE_PASS}
      - POSTGRES_DB=${PHARMACY_DATABASE_NAME}
    volumes:
      - pharmacy_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PHARMACY_DATABASE_USER} -d ${PHARMACY_DATABASE_NAME}"]
